work_dir: ./work_dir/baselines/kinetics/agcn_kinetics_joint
model_saved_name: ./runs/baselines/agcn_kinetics_joint
# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: /data/sets/kinetics/train_data_joint.npy
  label_path: /data/sets/kinetics/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: /data/sets/kinetics/val_data_joint.npy
  label_path: /data/sets/kinetics/val_label.pkl

# model
model: model.agcn.AGCN
model_name: agcn
model_args:
  num_class: 400
  num_point: 18
  num_person: 2
  graph: graph.kinetics.Graph
  graph_args:
    labeling_mode: 'spatial'

#optim
weight_decay: 0.0001
base_lr: 0.1
step: [45, 55]

# training
device: [0,1,2,3]
batch_size: 128
test_batch_size: 256
num_epoch: 65
nesterov: True