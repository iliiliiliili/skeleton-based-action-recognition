# feeder
feeder: feeders.feeder.Feeder
test_feeder_args:
  data_path: /data/sets/ntu3d/ntu120/xset/val_data_joint.npy
  label_path: /data/sets/ntu3d/ntu120/xset/val_label.pkl
  debug: False

# model
model: model.vnn_stgcn.VStgcn
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'
  samples: 10
  test_samples: 10


