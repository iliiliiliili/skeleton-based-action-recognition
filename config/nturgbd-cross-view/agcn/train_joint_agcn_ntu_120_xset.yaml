work_dir: ./work_dir/baselines/xset/agcn_ntu_120_joint
model_saved_name: ./runs/baselines/xset_agcn_ntu_120_joint
# feeder
feeder: feeders.feeder.Feeder
train_feeder_args:
  data_path: /data/sets/ntu3d/ntu120/xset/train_data_joint.npy
  label_path: /data/sets/ntu3d/ntu120/xset/train_label.pkl
  debug: False
  random_choose: False
  random_shift: False
  random_move: False
  window_size: -1
  normalization: False

test_feeder_args:
  data_path: /data/sets/ntu3d/ntu120/xset/val_data_joint.npy
  label_path: /data/sets/ntu3d/ntu120/xset/val_label.pkl

# model
model: model.agcn.AGCN
model_name: agcn
model_args:
  num_class: 120
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'

#optim
weight_decay: 0.0001
base_lr: 0.1
step: [60, 100]

# training
device: [0,1,2]
batch_size: 32
test_batch_size: 64
num_epoch: 120
nesterov: True
