# feeder
feeder: feeders.feeder.Feeder
test_feeder_args:
  data_path: /data/sets/ntu3d/ntu60/xsub/val_data_joint.npy
  label_path: /data/sets/ntu3d/ntu60/xsub/val_label.pkl
  debug: False

# model
model: model.vnn_agcn.VAGCN
# model: model.iu_vnn_agcn.IUVAGCN
model_name: agcn
model_args:
  num_class: 60
  num_point: 25
  num_person: 2
  graph: graph.ntu_rgb_d.Graph
  graph_args:
    labeling_mode: 'spatial'
  samples: 2
  test_samples: 10
  # iu_layers: [5, 10]


# test 
phase: test
# weights: ./runs/vntu/ntu_cv_vstgcn_joint_big_2-49-29400.pt
weights: ./runs/vagcn/xsub_ivagcn_ntu_60_joint-29-37560.pt

# work_dir: ./work_dir/vntu/xview/vstgcn_joint_big_5
# model_saved_name: ./runs/vntu/ntu_cv_vstgcn_joint_big_5
work_dir: ./work_dir/vstgcn/xsub/ivagcn_ntu_60
model_saved_name: ./runs/vstgcn/xsub_ivagcn_ntu_60
save_score: True
samples: [1,2,3,4,5,10,15,20,30,40]
device: [0,1,2,3]
test_batch_size: [512,512,512,512,512,256,256,128,128,128]
# device: [0,1]
# test_batch_size: [512,512,512,512,512,256,256,128,128,128]
